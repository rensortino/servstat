server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Common proxy settings, inherited by every /stat/<slug>/ block below.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 502 503 504 = @backend_down;

    # --- Monitored backends ---------------------------------------------------
    # nginx runs on the VPN-connected frontend host and bridges browser clients
    # (which may NOT be on the VPN) to each backend's :9989. One block per
    # server; add a matching { "name", "link": "/stat/<slug>/" } to config.json.
    #   * VPN machine    -> proxy to its VPN IP.
    #   * Scaleway server -> proxy to its public IP (lock inbound :9989 to this
    #     host's egress IP with a Scaleway Security Group).
    # This file and config.json are bind-mounted; after editing run
    # `make reload-frontend` (no image rebuild).

    location = /stat/gpu01/ { proxy_pass http://10.0.0.11:9989/stat; }    # VPN machine
    location = /stat/scw01/ { proxy_pass http://51.15.0.42:9989/stat; }   # Scaleway (public IP)

    location @backend_down {
        default_type application/json;
        return 503 '{"error":"backend unreachable"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
