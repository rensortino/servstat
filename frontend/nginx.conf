server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Local backend (Docker service on the same compose network) -----------
    location = /stat/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream backend:9989;
        proxy_pass http://$upstream/stat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }

    # --- Remote LAN backends --------------------------------------------------
    # To add a machine: copy one of the blocks below, replace the slug
    # (e.g. "gpu02") and the IP, then add a matching entry in config.json:
    #     { "name": "GPU 02", "link": "/stat/gpu02/" }
    # The remote machine must run the servstat backend reachable on :9989
    # from THIS host (LAN-internal — does NOT need to be publicly exposed).
    #
    # location = /stat/gpu02/ {
    #     proxy_pass http://192.168.1.11:9989/stat;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_intercept_errors on;
    #     error_page 502 503 504 = @backend_down;
    # }
    #
    # location = /stat/gpu03/ {
    #     proxy_pass http://192.168.1.12:9989/stat;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_intercept_errors on;
    #     error_page 502 503 504 = @backend_down;
    # }
    # --------------------------------------------------------------------------

    location @backend_down {
        default_type application/json;
        return 503 '{"error":"backend unreachable"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
