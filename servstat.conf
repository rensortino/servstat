server {
    listen 80;
    server_name localhost;

    # The root directory for your project's static files.
    # This is often set to /usr/share/nginx/html inside a Docker container.
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Proxy API requests to the backend service
    location / {
        # The service name 'backend' is used here, which Docker resolves
        # to the backend container's IP address (172.20.0.10).
        proxy_pass http://frontend/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
    
    # Proxy API requests to the backend service
    location /stat/ {
        # The service name 'backend' is used here, which Docker resolves
        # to the backend container's IP address (172.20.0.10).
        proxy_pass http://backend:9989/stat; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect server error pages to the static page /50x.html
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
