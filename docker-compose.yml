# To run only the backend and nginx:
# docker compose up -d
#
# To run the backend, nginx, and the frontend:
# docker compose --profile frontend up -d

services:
  backend:
    # Replace with your actual backend image
    image: servstat-backend:latest
    hostname: backend
    build: ./backend # Or use a build context
    networks:
      app_net:
        ipv4_address: 172.20.0.10
    restart: unless-stopped

  frontend:
    # Replace with your actual frontend image
    image: servstat-frontend:latest
    hostname: frontend
    build: ./frontend # Or use a build context
    networks:
      - app_net
    profiles:
      - frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      # Mount the site-specific configuration.
      # This will be included by the default nginx.conf.
      - ./servstat.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_net
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16