services:
  backend:
    image: servstat-backend:latest
    hostname: backend
    build: ./backend 
    volumes:
    - /:/host_root:ro  # Mount host's root at /host_root in container, read-only (ro), to monitor disk usage
    networks:
      app_net:
        ipv4_address: 172.20.0.10
    restart: unless-stopped
    deploy: # Add gpu allocation
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    image: servstat-frontend:latest
    hostname: frontend
    build: ./frontend 
    networks:
      - app_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      # Mount the site-specific configuration.
      # This will be included by the default nginx.conf.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_net
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16