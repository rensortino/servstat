services:
  backend:
    image: servstat-backend:latest
    hostname: backend
    build: ./backend
    volumes:
      # Mount host root read-only so disk usage reflects the actual machine.
      - /:/host_root:ro
      # Mount /data if present on the host. On hosts without /data, docker
      # creates an empty dir here — the backend detects same-fs-as-root and skips it.
      - /data:/host_data:ro
    environment:
      # Surface the real host name in /stat (otherwise os.uname() returns "backend").
      HOST_HOSTNAME: ${HOSTNAME:-localhost}
    networks:
      app_net:
        ipv4_address: 172.20.0.10
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    image: servstat-frontend:latest
    hostname: frontend
    build: ./frontend
    ports:
      - "80:80"
    networks:
      - app_net
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
